<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker Notes - Kotlin for Java Developers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            padding: 40px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .slide-indicator {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
        }
        
        .slide-title {
            color: #667eea;
            font-size: 24px;
            margin: 20px 0 20px 0;
            font-weight: 600;
        }
        
        .notes-content {
            color: #555;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 20px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        
        .sync-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #4caf50;
            color: white;
            border-radius: 24px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .sync-status.active {
            opacity: 1;
        }
        
        .instructions {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .slide-counter {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Speaker Notes</h1>
            <div class="slide-counter">Slide <span id="slideNum">1</span> of <span id="totalSlides">12</span></div>
        </div>
        
        <div class="slide-title" id="slideTitle">Welcome</div>
        <div class="notes-content" id="notesContent">
            Loading speaker notes...
        </div>
        
        <div class="navigation">
            <button id="prevBtn" onclick="previousSlide()">← Previous</button>
            <button id="nextBtn" onclick="nextSlide()">Next →</button>
        </div>
        
        <div class="instructions">
            💡 Notes automatically update when you navigate slides in the presentation<br>
            You can also use Previous/Next buttons to navigate here
        </div>
    </div>
    
    <div class="sync-status" id="syncStatus">✓ Synced</div>
    
    <script>
        let speakerNotes = [];
        let currentSlide = 1;
        
        // Load speaker notes
        async function loadNotes() {
            try {
                const response = await fetch('speaker-notes.json');
                const data = await response.json();
                speakerNotes = data.notes;
                document.getElementById('totalSlides').textContent = speakerNotes.length;
                displayCurrentNote();
            } catch (error) {
                console.error('Error loading speaker notes:', error);
                document.getElementById('notesContent').textContent = 'Error loading speaker notes';
            }
        }
        
        // Display current note
        function displayCurrentNote() {
            if (speakerNotes.length > 0 && currentSlide > 0 && currentSlide <= speakerNotes.length) {
                const note = speakerNotes[currentSlide - 1];
                document.getElementById('slideNum').textContent = currentSlide;
                document.getElementById('slideTitle').textContent = note.title;
                document.getElementById('notesContent').textContent = note.notes;
                updateNavigationButtons();
            }
        }
        
        // Update navigation buttons state
        function updateNavigationButtons() {
            document.getElementById('prevBtn').disabled = currentSlide <= 1;
            document.getElementById('nextBtn').disabled = currentSlide >= speakerNotes.length;
        }
        
        // Navigate to next slide
        function nextSlide() {
            if (currentSlide < speakerNotes.length) {
                currentSlide++;
                displayCurrentNote();
                showSyncStatus();
            }
        }
        
        // Navigate to previous slide
        function previousSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                displayCurrentNote();
                showSyncStatus();
            }
        }
        
        // Show sync status briefly
        function showSyncStatus() {
            const status = document.getElementById('syncStatus');
            status.classList.add('active');
            setTimeout(() => {
                status.classList.remove('active');
            }, 2000);
        }
        
        // Check for slide updates from presentation
        function checkForSlideUpdate() {
            const storedSlide = localStorage.getItem('currentSlide');
            if (storedSlide && !isNaN(storedSlide)) {
                const newSlide = parseInt(storedSlide);
                if (newSlide !== currentSlide) {
                    currentSlide = newSlide;
                    displayCurrentNote();
                    showSyncStatus();
                }
            }
        }
        
        // Listen for custom slide change events
        window.addEventListener('slideChange', function(e) {
            currentSlide = e.detail.slide;
            displayCurrentNote();
            showSyncStatus();
        });
        
        // Initialize and check for updates
        loadNotes();
        setInterval(checkForSlideUpdate, 500);
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextSlide();
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                previousSlide();
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
